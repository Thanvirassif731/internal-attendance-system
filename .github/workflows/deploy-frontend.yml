name: Deploy Attendance Frontend to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

jobs:
  deploy:
    name: Build and Deploy Attendance Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Attendance Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify API URL in build
        run: |
          echo "Checking frontend API URL..."

          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is empty or not configured."
            exit 1
          fi

          if grep -R -F -q "$VITE_API_URL" ./frontend/dist/assets/*.js; then
            echo "Correct API URL found in build."
          else
            echo "::error::API URL not found in build."
            exit 1
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify build output
        run: |
          if [ ! -f "./frontend/dist/index.html" ]; then
            echo "::error::frontend/dist/index.html was not generated"
            exit 1
          fi

          echo "Frontend build successful!"
          ls -lah ./frontend/dist

      - name: Deploy frontend to S3
        run: |
          aws s3 sync ./frontend/dist/ "s3://${S3_BUCKET}/" --delete

      - name: Deployment completed
        run: |
          echo "Attendance frontend deployment completed successfully!"
